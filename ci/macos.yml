# macOS CI（還沒啟用）：把這個檔案移到 .github/workflows/macos.yml 才會跑。
# 目前推送帳號的 GitHub token 沒有 `workflow` 權限，無法直接推到 .github/workflows/。
# 產出：egui-xq-demo（arm64+x86_64 通用執行檔、ad-hoc 簽章）。放進 gpui-xq-demo 的 bench/mac/bin/ 就能跑 Mac 壓測。
name: macos
on:
  push:
    branches: [mac-bench, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup update stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (arm64 + x86_64) + universal
        env: { MACOSX_DEPLOYMENT_TARGET: "11.0" }
        run: |
          for T in aarch64-apple-darwin x86_64-apple-darwin; do cargo build --release --locked --target $T; done
          mkdir -p out
          lipo -create -output out/egui-xq-demo target/aarch64-apple-darwin/release/egui-xq-demo target/x86_64-apple-darwin/release/egui-xq-demo
          codesign --force -s - out/egui-xq-demo
          ditto -c -k out/egui-xq-demo egui-xq-demo-macos.zip
      - uses: actions/upload-artifact@v4
        with: { name: egui-xq-demo-macos, path: egui-xq-demo-macos.zip, retention-days: 30 }
