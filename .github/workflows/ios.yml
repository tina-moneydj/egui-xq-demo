# iOS：在 GitHub 的 Mac 機器上編 egui 手機版（模擬器＋實機），在模擬器上真的開起來截圖，
# 並把模擬器用的 .app 和產生好的 Xcode 專案放到「ios-latest」預發行版（公開 repo，下載不用登入）。
# TestFlight 那一段只有在 repo 設了 App Store Connect 的 secrets 才會跑（見 bench/ios/README.md 附錄）。
name: ios
on:
  push:
    branches: [mobile-ios]
    paths: [".github/workflows/ios.yml", "mobile/**", "src/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 版本（挑這台上最新的）
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes | tail -5
      - name: Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim && rustc -V
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mobile/target
          key: ios-egui-${{ hashFiles('mobile/Cargo.lock') }}
          restore-keys: ios-egui-
      - name: XcodeGen → XQEGUI.xcodeproj
        run: |
          brew install xcodegen
          cd mobile/ios && xcodegen generate && ls
      - name: Rust 靜態庫（模擬器、實機）
        working-directory: mobile
        run: |
          cargo rustc --lib --release --target aarch64-apple-ios-sim --crate-type staticlib
          cargo rustc --lib --release --target aarch64-apple-ios --crate-type staticlib
          ls -l target/aarch64-apple-ios-sim/release/*.a target/aarch64-apple-ios/release/*.a
      - name: Xcode 建置（模擬器）
        working-directory: mobile/ios
        run: |
          xcodebuild -project XQEGUI.xcodeproj -scheme XQEGUI -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
          ls build/Build/Products/Release-iphonesimulator/
      - name: Xcode 建置（實機，不簽章，只確認編得過）
        working-directory: mobile/ios
        run: |
          xcodebuild -project XQEGUI.xcodeproj -scheme XQEGUI -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-dev CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: 模擬器冒煙測試（開 app、等 40 秒、截圖）
        working-directory: mobile/ios
        run: |
          set -x
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]; print(c[-1]["udid"])')
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          APPP=build/Build/Products/Release-iphonesimulator/XQEGUI.app
          xcrun simctl install "$DEV" "$APPP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APPP/Info.plist")
          mkdir -p ../../smoke
          SIMCTL_CHILD_XQ_METRICS=1 xcrun simctl launch --stdout=$PWD/../../smoke/stdout.txt --stderr=$PWD/../../smoke/stderr.txt "$DEV" "$BID"
          sleep 40
          xcrun simctl io "$DEV" screenshot ../../smoke/egui-list.png
          xcrun simctl terminate "$DEV" "$BID" || true
          # 第二次：直接開走勢圖畫面（XQ_SCREEN=chart）
          SIMCTL_CHILD_XQ_METRICS=1 SIMCTL_CHILD_XQ_SCREEN=chart xcrun simctl launch --stdout=$PWD/../../smoke/stdout-chart.txt --stderr=$PWD/../../smoke/stderr-chart.txt "$DEV" "$BID"
          sleep 25
          xcrun simctl io "$DEV" screenshot ../../smoke/egui-chart.png
          xcrun simctl terminate "$DEV" "$BID" || true
          echo "── 報價表 log ──"; grep -v FRAMES ../../smoke/stderr.txt | head -40 || true
          grep FRAMES ../../smoke/stderr.txt | tail -3 || true
          echo "── 走勢圖 log ──"; grep -v FRAMES ../../smoke/stderr-chart.txt | head -20 || true
          grep FRAMES ../../smoke/stderr-chart.txt | tail -3 || true
      - name: 打包產物
        run: |
          mkdir -p out
          (cd mobile/ios/build/Build/Products/Release-iphonesimulator && ditto -c -k --keepParent XQEGUI.app "$GITHUB_WORKSPACE/out/XQEGUI-simulator.zip")
          (cd mobile/ios && zip -qr "$GITHUB_WORKSPACE/out/XQEGUI-xcodeproj.zip" XQEGUI.xcodeproj)
          cp smoke/* out/ 2>/dev/null || true
          # log 裡的使用者路徑匿名化
          sed -i '' -e "s|$HOME|~|g" -e "s|/Users/[^/ ]*|/Users/<user>|g" out/*.txt 2>/dev/null || true
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: xq-egui-ios
          path: out/
      - name: 更新 ios-latest 預發行版
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --prerelease --target "$GITHUB_SHA" --title "iOS 測試包（最新）" --notes "mobile-ios 分支自動產生。說明見 bench/ios/README.md。"
          gh release upload ios-latest out/XQEGUI-simulator.zip out/XQEGUI-xcodeproj.zip out/*.png --clobber
          gh release edit ios-latest --notes "mobile-ios 分支 ${GITHUB_SHA::7} 自動產生（$(date -u +%Y-%m-%dT%H:%MZ)）。XQEGUI-simulator.zip＝模擬器用 app；說明見 bench/ios/README.md。"
