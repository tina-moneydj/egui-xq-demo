# Windows release build：egui-xq-demo.exe（本 repo 是私人的；release 也只有有權限的人看得到）
name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        shell: pwsh
        run: cargo build --release --locked
      - name: Test
        shell: pwsh
        run: cargo test --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/egui-xq-demo.exe dist/
          "egui-xq-demo $env:GITHUB_SHA $(Get-Date -Format o)" | Set-Content dist/egui-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: egui-xq-demo-windows-x64
          path: dist/*
      - name: Publish bench-latest pre-release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete bench-latest --cleanup-tag -y 2>$null
          gh release create bench-latest dist/* --prerelease --target $env:GITHUB_SHA `
            --title "Windows bench build (main $($env:GITHUB_SHA.Substring(0,7)))" `
            --notes "main 最新版的 Windows release build（自動產生），給 gpui-xq-demo/bench/windows 壓測工具包用。"
