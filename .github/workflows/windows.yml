# Windows 預先編譯版：egui-xq-demo.exe，並組成完整的 Windows 壓測包（本 repo 公開；release 不用登入就能下載）
# 完整包 = gpui-xq-demo 公開 release windows-bench-latest 的 xq-bench-windows-gpui.zip（工具包＋GPUI＋行情產生器）＋ 這裡編的 egui-xq-demo.exe
# 網頁情境（web）：GPUI 包裡已有 web\gpui；這裡從 main 分支的 examples/web-multi 編 egui 網頁版放進 web\egui。
name: windows

on:
  push:
    branches: [windows-bench-ci]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        shell: pwsh
        run: cargo build --release --locked
      - name: Test
        shell: pwsh
        run: cargo test --release --locked
      - name: Package egui
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/egui-xq-demo.exe dist/
          "egui-xq-demo $env:GITHUB_SHA ($env:GITHUB_REF_NAME) $(Get-Date -Format o)" | Set-Content dist/egui-build.txt
      - name: 網頁版範例原始碼（main 分支的 examples/web-multi）
        uses: actions/checkout@v4
        with: { ref: main, path: webmain }
      - name: 編 egui 網頁版（一頁嵌多個元件；失敗就不放，壓測包的 web 情境會自動略過 egui）
        continue-on-error: true
        shell: bash
        run: |
          [ -f webmain/examples/web-multi/page.js ] || { echo "main 還沒有新版 examples/web-multi（page.js）"; exit 1; }
          rustup target add wasm32-unknown-unknown
          V=$(grep -A1 '^name = "wasm-bindgen"$' webmain/examples/web-multi/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "wasm-bindgen $V"
          wasm-bindgen --version 2>/dev/null | grep -q " $V$" || cargo install wasm-bindgen-cli --version "$V" --locked
          curl -sSL -o binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_124/binaryen-version_124-x86_64-windows.tar.gz \
            && tar xzf binaryen.tgz && export WASM_OPT="$PWD/binaryen-version_124/bin/wasm-opt.exe" || echo "沒有 wasm-opt，略過最佳化"
          (cd webmain/examples/web-multi && ./build.sh)
          mkdir -p web-egui && cp webmain/dist/web-multi/index.html webmain/dist/web-multi/page.js webmain/dist/web-multi/xq_web_multi.js webmain/dist/web-multi/xq_web_multi_bg.wasm web-egui/
          ls -la web-egui
      - name: 組完整壓測包（下載 gpui-xq-demo 公開 release 的 GPUI 工具包，加進 egui）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ($i = 1; $i -le 30; $i++) {
            gh release download windows-bench-latest -R tina-moneydj/gpui-xq-demo -p xq-bench-windows-gpui.zip --clobber
            if ($LASTEXITCODE -eq 0 -and (Test-Path xq-bench-windows-gpui.zip)) { break }
            Write-Host "gpui-xq-demo 的 windows-bench-latest 還沒有 xq-bench-windows-gpui.zip，等 60 秒（$i/30）"; Start-Sleep 60
          }
          if (-not (Test-Path xq-bench-windows-gpui.zip)) { throw "下載不到 GPUI 工具包" }
          $global:LASTEXITCODE = 0
          Expand-Archive xq-bench-windows-gpui.zip -DestinationPath kit -Force
          Copy-Item dist/egui-xq-demo.exe, dist/egui-build.txt kit/xq-bench-windows/bin/
          if (Test-Path web-egui) { New-Item -ItemType Directory -Force kit/xq-bench-windows/web | Out-Null; Remove-Item kit/xq-bench-windows/web/egui -Recurse -Force -ErrorAction SilentlyContinue; Copy-Item web-egui kit/xq-bench-windows/web/egui -Recurse }
          if (Test-Path kit/xq-bench-windows/web) { Get-ChildItem kit/xq-bench-windows/web -Recurse | Format-Table FullName, Length } else { "（沒有網頁版）" }
          Get-ChildItem kit/xq-bench-windows/bin | Format-Table Name, Length
          Compress-Archive -Path kit/xq-bench-windows -DestinationPath dist/xq-bench-windows.zip -Force
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: xq-bench-windows
          path: dist/*
      - name: Publish windows-bench-latest pre-release
        if: github.ref == 'refs/heads/windows-bench-ci'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-bench-latest --cleanup-tag -y 2>$null
          $global:LASTEXITCODE = 0
          gh release create windows-bench-latest dist/xq-bench-windows.zip dist/egui-xq-demo.exe --prerelease --target $env:GITHUB_SHA `
            --title "Windows 壓測包完整版（GPUI＋egui，windows-bench-ci $($env:GITHUB_SHA.Substring(0,7))）" `
            --notes "下載 xq-bench-windows.zip → 解壓 → 雙擊 run-bench.cmd → 把結果 zip 傳回來。說明：gpui-xq-demo 的 bench/windows/README.md"
